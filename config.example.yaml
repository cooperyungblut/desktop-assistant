# Copy to config.yaml (git-ignored) and edit. Relative paths are relative to this file.

# The synced Google Drive folder that contains briefs/ and escalations/.
# For development, point it at the local fake inbox: data/inbox
# Windows example: "C:/Users/you/My Drive/Secretary"  (forward slashes are fine)
secretary_dir: data/inbox

state_file: data/state.json
persona_file: personas/juniper.yaml

# Google Drive for Desktop doesn't reliably raise file events, so the app polls.
poll_seconds: 5

# Her own lines around a brief readout: a first reaction before it, a couple of
# quick asides between paragraphs, a line after. Written by the local model in
# the persona's voice; the brief itself is still read word for word, and any
# line with a number or a name that isn't in the brief is dropped.
brief_framing:
  enabled: true
  asides: 2           # most reactions between paragraphs (0 = opener and closer only)
  wait_seconds: 3     # if the model isn't ready by then (e.g. still loading), she just reads

# How many past user/assistant exchanges to send to the model each turn.
history_turns: 12

host: 127.0.0.1
port: 8765

ollama:
  url: http://127.0.0.1:11434
  model: gemma4:12b    # check the exact tag at ollama.com/library; any chat model works
  keep_alive: 30m      # VRAM is freed after this long idle (next question reloads, ~20 s); -1 = never
  unload_on_exit: true # free that VRAM when the app quits
  think: false         # thinking models (Gemma 4, Qwen3) otherwise reason silently for seconds first

tts:
  engine: kokoro       # "none" disables speech (text-only mode)
  model_path: models/kokoro-v1.0.onnx
  voices_path: models/voices-v1.0.bin

# Push-to-talk speech input (Milestone 2). Needs: uv sync --extra tts --extra stt
stt:
  engine: whisper      # "none" disables the mic button
  model: small.en      # base.en is faster, medium.en more accurate
  device: cpu          # "cuda" saves ~1 s per question but costs ~1 GB VRAM
  compute_type: int8   # use int8_float16 with cuda
  download_dir: models/whisper
