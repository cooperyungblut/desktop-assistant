[project]
name = "desk-secretary"
version = "0.1.0"
description = "A local AI secretary: a 3D VRM avatar that reads your daily briefs aloud and answers follow-ups with a local LLM."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Kept optional so CI and tests never download speech models.
tts = ["kokoro-onnx>=0.4", "numpy>=1.26"]
stt = ["faster-whisper>=1.1"]
# Only for stt.device: cuda on Windows. Large downloads (~1 GB).
stt-gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
desk-secretary = "secretary.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "numpy>=1.26", "av>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secretary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
